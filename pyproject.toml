[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hallucination-pmi-ensemble"
version = "0.1.0"
description = "Frozen PMI plus length-control hallucination-risk stacker for Q/A detector features."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]

[project.scripts]
hallucination-pmi-ensemble = "hallucination_pmi_ensemble.cli:main"

[tool.setuptools]
packages = ["hallucination_pmi_ensemble"]

[tool.setuptools.package-data]
hallucination_pmi_ensemble = ["artifacts/*.json"]
